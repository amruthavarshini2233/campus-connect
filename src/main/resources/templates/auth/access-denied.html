<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}"></head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/layout :: navbar('access-denied')}"></div>

<main class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow rounded-4 p-5 bg-white">
                <div class="mb-3">
                    <span class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle p-3" style="width: 76px; height: 76px;">
                        <i class="bi bi-shield-x display-5 fw-bold"></i>
                    </span>
                </div>
                <h1 class="h2 fw-bold text-dark mb-2">403 — Access Denied</h1>
                <p class="text-secondary lead mb-3">
                    Administrator Privileges Required
                </p>
                <div class="alert alert-warning text-start small mb-4">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>
                    You are logged in with <strong>STUDENT</strong> credentials. Administrative functions, event publishing, and participant management require verified <strong>ADMIN</strong> role authorization.
                </div>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-indigo fw-bold px-4">
                        <i class="bi bi-house-door me-1"></i> Student Portal
                    </a>
                    <a th:href="@{/my-registrations}" class="btn btn-outline-secondary fw-semibold px-4">
                        <i class="bi bi-ticket-perforated me-1"></i> My Registrations
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/layout :: footer}"></div>

<!-- Bootstrap Scripts -->
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
