<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notice')}"></head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/layout :: navbar('home')}"></div>

<main class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <div class="mb-3">
                    <span class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle p-3" style="width: 72px; height: 72px;">
                        <i class="bi bi-exclamation-triangle display-5 fw-bold"></i>
                    </span>
                </div>
                <h1 class="display-6 fw-bold text-dark mb-2" th:text="${errorCode != null ? errorCode : 'Oops!'}">Notice</h1>
                <p class="text-secondary lead mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested page or resource could not be found or processed.'}">
                    Something unexpected happened.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-indigo fw-bold px-4">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                    <a th:href="@{/#events}" class="btn btn-outline-secondary fw-semibold px-4">
                        <i class="bi bi-compass me-1"></i> Browse Events
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/layout :: footer}"></div>

<!-- Bootstrap Scripts -->
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
