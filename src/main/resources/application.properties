spring.application.name=campusconnect

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campusconnect}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8081}
server.error.include-message=always
server.error.include-binding-errors=always

# Email (SMTP) Configuration - Supports both MAIL_* and SPRING_MAIL_* environment variables
app.mail.enabled=${APP_MAIL_ENABLED:${MAIL_ENABLED:false}}
app.mail.sender-email=${APP_MAIL_SENDER_EMAIL:${MAIL_FROM:${MAIL_USERNAME:noreply@campusconnect.edu}}}
app.mail.sender-name=${APP_MAIL_SENDER_NAME:CampusConnect Team}

spring.mail.host=${MAIL_HOST:${SPRING_MAIL_HOST:localhost}}
spring.mail.port=${MAIL_PORT:${SPRING_MAIL_PORT:587}}
spring.mail.username=${MAIL_USERNAME:${SPRING_MAIL_USERNAME:}}
spring.mail.password=${MAIL_PASSWORD:${SPRING_MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:${SPRING_MAIL_AUTH:true}}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:${SPRING_MAIL_STARTTLS:true}}
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.connectiontimeout=6000
spring.mail.properties.mail.smtp.timeout=6000
spring.mail.properties.mail.smtp.writetimeout=6000

# Default Admin Configuration for Local Seeding
admin.default.email=${ADMIN_EMAIL:admin@campusconnect.edu}
admin.default.password=${ADMIN_PASSWORD:Admin@12345}
